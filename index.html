<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CosmoLens</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Black+Ops+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/src/assets/style.css">
  </head>
  <body>

      <main class="container my-4">
        <div class="row justify-content-center mb-4">

          <div class="col-12 col-md-4 col-lg-4">

          <div class=" card bg-dark border-secodary p-3 shadow">
            <div class="d-flex align-items-center justify-content-center gap-2">
              <label for="select_date" class="form-label text-white mb-0 fw-bold">Select Date:</label>
              <input type="date" id="select_date" class="form-control form-control-dark w-auto">

              <button id="btn-random" class="btn btn-outline-info">🎲 Random Picture</button>

              <button id="btn-view-favs" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#favsModal">
                ⭐ Saved (<span id="fav-count">0</span>)
              </button>
            </div>
          </div>  
          </div>


        </div>
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6" id="app"></div>
  </div>
   </main>


<div class="modal fade" id="favsModal" tabindex="-1" aria-labelledby="favsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title font-orbitron" id="favsModalLabel">⭐ Favorite Discoveries</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3" id="favorites-grid">
              <p class="text-center text-muted">No favorites saved yet!</p>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
    <script type="module" src="/src/assets/main.js"></script>

  </body>
</html>
